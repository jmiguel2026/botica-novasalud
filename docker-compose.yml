version: '3.8'

services:
  # 1. Base de Datos (Reemplaza a XAMPP)
  mysql_db:
    image: mysql:8.0
    container_name: botica_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: botica_novasalud
    ports:
      - "3306:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql

  # 2. Backend (Node.js)
  backend:
    build: ./server
    container_name: botica_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=mysql_db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=botica_novasalud
    depends_on:
      - mysql_db

  # 3. Frontend (React)
  frontend:
    build: ./client
    container_name: botica_frontend
    restart: always
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  mysql_data: